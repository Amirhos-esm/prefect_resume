services:
  resume:
    build: .
    ports:
      - "8080:8080"
    environment:
      BASE_URL: ${BASE_URL:-http://localhost:8080}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      SECURE_COOKIES: ${SECURE_COOKIES:-false}
    volumes:
      - resume_data:/app/data
      - resume_uploads:/app/uploads
    restart: unless-stopped

volumes:
  resume_data:
  resume_uploads:
